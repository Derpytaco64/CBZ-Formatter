[project]
name = "cbzforge"
version = "0.1.0"
description = "Organize, tag, and repackage CBZ/manga volumes with ComicInfo.xml metadata"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "PySide6>=6.7",
    "Pillow>=10.0",
    "rapidocr-onnxruntime>=1.2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
cbzforge = "cbzforge.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "network: hits real external APIs, may be flaky/slow (deselect with -m 'not network')",
]

[tool.setuptools.packages.find]
include = ["cbzforge*"]
